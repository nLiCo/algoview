<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>탐색 시각화 – AlgoView</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <header>
    <h1>AlgoView</h1>
    <nav>
      <a href="index.html">처음으로</a>
      <a href="sort.html">정렬</a>
      <a href="graph.html">탐색</a>
      <a href="quiz.html">퀴즈</a>
    </nav>
  </header>

  <main>
    <h2>탐색 시각화</h2>

    <!-- 격자 크기 입력: 적용하면 격자를 새로 만들고 벽도 지운다 -->
    <section class="controls">
      <label>
        행 (5~20)
        <input type="number" id="rows-input" min="5" max="20" value="15">
      </label>
      <label>
        열 (5~30)
        <input type="number" id="cols-input" min="5" max="30" value="25">
      </label>
      <button type="button" id="apply-btn">크기 적용</button>
    </section>

    <!-- 격자: 칸(div)은 graph.js가 만든다 -->
    <section>
      <h3>격자</h3>
      <div id="grid" class="grid"></div>

      <p id="message" class="message"></p>

      <!-- 칸 색의 의미 -->
      <ul class="legend">
        <li><span class="swatch start"></span>시작</li>
        <li><span class="swatch goal"></span>도착</li>
      </ul>
    </section>
  </main>

  <footer>
    <p>웹프로그래밍 개인 프로젝트 · 2026</p>
  </footer>

  <!-- HTML 요소가 다 만들어진 뒤에 실행되도록 body 맨 끝에 둔다 -->
  <script src="./js/graph.js"></script>
</body>
</html>
