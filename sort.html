<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>정렬 시각화 – AlgoView</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <header>
    <h1>AlgoView</h1>
    <nav>
      <a href="index.html">처음으로</a>
      <a href="sort.html">정렬</a>
      <a href="graph.html">탐색</a>
      <a href="quiz.html">퀴즈</a>
    </nav>
  </header>

  <main>
    <h2>정렬 시각화</h2>

    <!-- 조작 버튼: 실행 중에는 sort.js가 비활성화한다 -->
    <section class="controls">
      <label>
        알고리즘
        <select id="algo-select">
          <option value="bubble">버블 정렬</option>
          <option value="selection">선택 정렬</option>
          <option value="insertion">삽입 정렬</option>
        </select>
      </label>
      <label>
        배열 크기 (5~50)
        <input type="number" id="size-input" min="5" max="50" value="10">
      </label>
      <button type="button" id="random-btn">무작위 생성</button>
      <button type="button" id="run-btn">실행</button>
      <button type="button" id="pause-btn" disabled>일시정지</button>
      <button type="button" id="step-btn">한 단계</button>
      <label>
        속도
        <input type="range" id="speed-input" min="1" max="5" value="3">
      </label>
    </section>

    <!-- 막대 그래프 -->
    <section>
      <h3 id="algo-title">버블 정렬</h3>
      <div id="bars" class="bars"></div>
      <p id="message" class="message">무작위 생성으로 배열을 만든 뒤 실행해 보세요.</p>

      <!-- 막대 색의 의미 -->
      <ul class="legend">
        <li><span class="swatch"></span>대기</li>
        <li><span class="swatch compare"></span>비교 중</li>
        <li><span class="swatch swap"></span>교환</li>
        <!-- 삽입 정렬을 골랐을 때만 sort.js가 보이게 한다 -->
        <li id="ordered-legend" hidden><span class="swatch ordered"></span>순서만 맞음 (자리 미확정)</li>
        <li><span class="swatch sorted"></span>자리 확정</li>
      </ul>
    </section>
  </main>

  <footer>
    <p>웹프로그래밍 개인 프로젝트 · 2026</p>
  </footer>

  <!-- HTML 요소가 다 만들어진 뒤에 실행되도록 body 맨 끝에 둔다 -->
  <script src="./js/sort.js"></script>
</body>
</html>
